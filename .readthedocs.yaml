# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # The default PyPI torch wheel on Linux bundles CUDA (several GB); the docs
    # only need to import it, so install the much smaller CPU build first.
    pre_install:
      - pip install torch --index-url https://download.pytorch.org/whl/cpu

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
