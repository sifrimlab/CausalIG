name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (CUDA torch + dev extras)
        run: |
          python -m pip install --upgrade pip
          # Install the CUDA build of torch (default PyPI wheel on Linux).
          pip install torch --index-url https://download.pytorch.org/whl/cu124
          pip install -e ".[dev,experiments]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Tests
        run: pytest --cov=causalig --cov=experiments --cov-report=term-missing

  docs-build:
    # Mirrors the Read the Docs build (.readthedocs.yaml) so broken docs fail the PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU torch + docs requirements)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r docs/requirements.txt
          pip install .

      - name: Build docs (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  docs-deploy:
    runs-on: ubuntu-latest
    needs: docs-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
